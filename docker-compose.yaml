version: '3.8'

services:
  game-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chouse-game
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://game-db:5432/chouse_game
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      POLL_SERVICE_URL: http://host.docker.internal:8081
      USER_SERVICE_URL: http://host.docker.internal:8082
    depends_on:
      game-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-db:
    image: postgres:17-alpine
    container_name: chouse-game-db
    environment:
      POSTGRES_DB: chouse_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chouse_game"]
      interval: 5s
      timeout: 3s
      retries: 10
